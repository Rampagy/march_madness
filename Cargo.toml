[package]
name = "march_madness"
version = "1.7.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
glob = "0.3.4"
rand = "0.10.3"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
rayon = "1.12.0"
serde_json = "1.0.154"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
